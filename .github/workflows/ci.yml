name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Windows validation
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        id: python312
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up Python 3.14
        id: python314
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Compile and self-test on Python 3.12
        shell: pwsh
        run: |
          & "${{ steps.python312.outputs.python-path }}" -m compileall -q codex_whale_v0.py tools
          & "${{ steps.python312.outputs.python-path }}" .\codex_whale_v0.py --self-test

      - name: Compile and self-test on Python 3.14
        shell: pwsh
        run: |
          & "${{ steps.python314.outputs.python-path }}" -m compileall -q codex_whale_v0.py tools
          & "${{ steps.python314.outputs.python-path }}" .\codex_whale_v0.py --self-test
